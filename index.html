<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceToPhone · HubSpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #1f58eb;
      --accent-ink: #0f3bad;
      --accent-wash: #eaf0ff;
      --ink: #0b1230;
      --ink-2: #1e2850;
      --muted: #5a658a;
      --bg: #ffffff;
      --surface: #f8faff;
      --line: #e3e7f3;
      --ok: #0d7a4d;
      --warn: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Figtree", -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--accent) 0%, #4f80ff 100%);
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .logo {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: rgba(255,255,255,0.2);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header .status {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      opacity: 0.9;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    header .status::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    header .status.off::before { background: #f87171; }

    main {
      flex: 1;
      padding: 20px 18px;
      overflow-y: auto;
    }

    .pantalla {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .pantalla .num {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.04em;
      min-height: 32px;
      word-break: break-all;
    }
    .pantalla .lbl {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 6px;
    }
    .pantalla .nombre {
      font-size: 13px;
      color: var(--ink-2);
      margin-top: 4px;
      font-weight: 500;
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .tecla {
      aspect-ratio: 1.3 / 1;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
      font-family: inherit;
    }
    .tecla small {
      display: block;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-top: 2px;
      font-weight: 400;
    }
    .tecla:hover {
      background: white;
      border-color: var(--accent);
      color: var(--accent);
    }
    .tecla:active { transform: scale(0.95); }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-call {
      background: var(--accent);
      color: white;
    }
    .btn-call:hover { background: var(--accent-ink); }
    .btn-call:disabled {
      background: var(--line);
      color: var(--muted);
      cursor: not-allowed;
    }
    .btn-clear {
      background: var(--surface);
      color: var(--ink-2);
      border: 1px solid var(--line);
    }
    .btn-clear:hover { background: white; border-color: var(--accent); color: var(--accent); }

    .llamada-activa {
      padding: 16px;
      background: var(--accent-wash);
      border-radius: 10px;
      border: 1px solid var(--accent);
      text-align: center;
    }
    .llamada-activa .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-ink);
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .llamada-activa .label::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }
    .llamada-activa .num {
      font-family: ui-monospace, monospace;
      font-size: 22px;
      font-weight: 500;
      margin: 10px 0;
      color: var(--accent-ink);
    }
    .llamada-activa .cronometro {
      font-family: ui-monospace, monospace;
      font-size: 32px;
      font-weight: 500;
      color: var(--accent-ink);
      font-variant-numeric: tabular-nums;
      margin-bottom: 14px;
    }
    .llamada-activa .btn-colgar {
      background: #dc2626;
      color: white;
      padding: 12px 32px;
    }
    .llamada-activa .btn-colgar:hover { background: #b91c1c; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    footer {
      padding: 10px 18px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
    }
    footer b { color: var(--ink-2); font-weight: 600; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="logo">V</span>
      <h1>VoiceToPhone</h1>
      <span class="status" id="status">Conectado</span>
    </header>

    <main>
      <!-- Modo marcador (default) -->
      <div id="modo-marcador">
        <div class="pantalla">
          <div class="num" id="pantalla-num">—</div>
          <div class="nombre" id="pantalla-nom"></div>
          <div class="lbl" id="pantalla-origen">Marca manualmente</div>
        </div>

        <div class="teclado">
          <button class="tecla" data-key="1">1</button>
          <button class="tecla" data-key="2">2<small>ABC</small></button>
          <button class="tecla" data-key="3">3<small>DEF</small></button>
          <button class="tecla" data-key="4">4<small>GHI</small></button>
          <button class="tecla" data-key="5">5<small>JKL</small></button>
          <button class="tecla" data-key="6">6<small>MNO</small></button>
          <button class="tecla" data-key="7">7<small>PQRS</small></button>
          <button class="tecla" data-key="8">8<small>TUV</small></button>
          <button class="tecla" data-key="9">9<small>WXYZ</small></button>
          <button class="tecla" data-key="*">*</button>
          <button class="tecla" data-key="0">0<small>+</small></button>
          <button class="tecla" data-key="#">#</button>
        </div>

        <div class="acciones">
          <button class="btn btn-clear" id="btn-clear">← Borrar</button>
          <button class="btn btn-call" id="btn-call" disabled>Llamar</button>
        </div>
      </div>

      <!-- Modo en llamada -->
      <div id="modo-llamada" class="hidden">
        <div class="llamada-activa">
          <div class="label">Llamada en curso</div>
          <div class="num" id="llamada-num">—</div>
          <div class="cronometro" id="cronometro">00:00</div>
          <button class="btn btn-colgar" id="btn-colgar">Colgar</button>
        </div>
      </div>
    </main>

    <footer>
      <span><b id="footer-estado">Listo</b></span>
      <span>Softphone VTP</span>
    </footer>
  </div>

  <!-- SDK oficial de HubSpot Calling Extensions -->
  <script src="https://cdn.jsdelivr.net/npm/@hubspot/calling-extensions-sdk@2.0.0/dist/main.js"></script>
  <script>
    // ──────────────────────────────────────────────────────────
    // Estado global del widget
    // ──────────────────────────────────────────────────────────
    const state = {
      numero: '',
      nombre: '',
      contactId: null,
      enLlamada: false,
      inicioLlamada: null,
      cronometroId: null,
      extensions: null,
    };

    // Bridge que lanza la llamada en SoftphonePro
    const BRIDGE_URL = 'https://apicrm.voicetophone.com/dial';

    // ──────────────────────────────────────────────────────────
    // UI: actualizar pantalla
    // ──────────────────────────────────────────────────────────
    function renderPantalla() {
      document.getElementById('pantalla-num').textContent = state.numero || '—';
      document.getElementById('pantalla-nom').textContent = state.nombre || '';
      document.getElementById('pantalla-origen').textContent = state.contactId
        ? 'Desde contacto de HubSpot'
        : 'Marca manualmente';
      document.getElementById('btn-call').disabled = !state.numero;
    }

    function entrarEnLlamada() {
      state.enLlamada = true;
      state.inicioLlamada = Date.now();
      document.getElementById('modo-marcador').classList.add('hidden');
      document.getElementById('modo-llamada').classList.remove('hidden');
      document.getElementById('llamada-num').textContent = state.numero;
      document.getElementById('footer-estado').textContent = 'En llamada';
      iniciarCronometro();
    }

    function salirDeLlamada() {
      state.enLlamada = false;
      pararCronometro();
      document.getElementById('modo-llamada').classList.add('hidden');
      document.getElementById('modo-marcador').classList.remove('hidden');
      document.getElementById('footer-estado').textContent = 'Listo';
      state.numero = '';
      state.nombre = '';
      state.contactId = null;
      renderPantalla();
    }

    function iniciarCronometro() {
      state.cronometroId = setInterval(() => {
        const seg = Math.floor((Date.now() - state.inicioLlamada) / 1000);
        const m = String(Math.floor(seg / 60)).padStart(2, '0');
        const s = String(seg % 60).padStart(2, '0');
        document.getElementById('cronometro').textContent = `${m}:${s}`;
      }, 1000);
    }

    function pararCronometro() {
      if (state.cronometroId) clearInterval(state.cronometroId);
      state.cronometroId = null;
    }

    // ──────────────────────────────────────────────────────────
    // Teclado del marcador
    // ──────────────────────────────────────────────────────────
    document.querySelectorAll('.tecla').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.numero += btn.dataset.key;
        state.contactId = null;
        state.nombre = '';
        renderPantalla();
      });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      state.numero = state.numero.slice(0, -1);
      renderPantalla();
    });

    // ──────────────────────────────────────────────────────────
    // Lanzar llamada vía el bridge VTP
    // ──────────────────────────────────────────────────────────
    function lanzarLlamada(numero, nombre) {
      // Abrir el bridge en una ventana invisible — lanza callto:
      const u = new URL(BRIDGE_URL);
      u.searchParams.set('n', numero);
      if (nombre) u.searchParams.set('nom', nombre);

      // Opción A: abrir en nueva pestaña (el bridge cierra sola después)
      window.open(u.toString(), '_blank', 'width=1,height=1,noopener');

      // Opción B (fallback si popup bloqueado): callto: directo
      // window.location.href = 'callto:' + numero;

      entrarEnLlamada();

      // Notificar a HubSpot que empezó la llamada
      if (state.extensions) {
        state.extensions.outgoingCall({
          createEngagement: true,
          phoneNumber: numero,
        });
      }
    }

    document.getElementById('btn-call').addEventListener('click', () => {
      if (!state.numero) return;
      lanzarLlamada(state.numero, state.nombre);
    });

    document.getElementById('btn-colgar').addEventListener('click', () => {
      const duracion = Math.floor((Date.now() - state.inicioLlamada) / 1000);
      // Notificar a HubSpot que terminó
      if (state.extensions) {
        state.extensions.callEnded({
          engagementProperties: {
            hs_call_duration: duracion * 1000,
            hs_call_status: 'COMPLETED',
          },
        });
      }
      salirDeLlamada();
    });

    // ──────────────────────────────────────────────────────────
    // SDK de HubSpot Calling Extensions
    // ──────────────────────────────────────────────────────────
    function initHubSpotSDK() {
      if (typeof window.CallingExtensions === 'undefined') {
        console.warn('[VTP] Calling Extensions SDK no cargado. Modo standalone.');
        document.getElementById('status').textContent = 'Sin HubSpot';
        document.getElementById('status').classList.add('off');
        return;
      }

      state.extensions = new window.CallingExtensions({
        debugMode: false,
        eventHandlers: {
          // HubSpot le dice al widget que está listo
          onReady: () => {
            console.log('[VTP] HubSpot ready');
            state.extensions.initialized({
              isLoggedIn: true,
              engagementId: null,
              iconUrl: 'https://voicetophone.com/images/favicon.png',
            });
          },

          // HubSpot dispara una llamada desde un contacto
          onDialNumber: (data) => {
            console.log('[VTP] onDialNumber', data);
            state.numero = (data.phoneNumber || '').replace(/[^\d+]/g, '');
            state.nombre = data.toPhoneNumber || '';
            state.contactId = data.ownerId || null;
            renderPantalla();
            // Marcar automáticamente
            lanzarLlamada(state.numero, state.nombre);
          },

          // HubSpot muestra el widget
          onVisibilityChanged: (data) => {
            console.log('[VTP] visibility', data);
          },

          onEndCall: () => {
            console.log('[VTP] HubSpot pidió colgar');
            if (state.enLlamada) {
              document.getElementById('btn-colgar').click();
            }
          },
        },
      });
    }

    // Esperar a que cargue el SDK
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initHubSpotSDK);
    } else {
      initHubSpotSDK();
    }
  </script>
</body>
</html>
